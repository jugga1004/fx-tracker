name: 환율 갱신

# 한국수출입은행 매매기준율을 받아 data/rates.json에 커밋한다.
# GitHub Pages는 정적 호스팅이라 서버 코드를 못 돌리므로, 요청 시점에 조회하는 대신
# 여기서 미리 받아두고 앱은 그 파일 하나만 읽는다.
#
# 필요한 것: 저장소 Settings → Secrets and variables → Actions → New repository secret
#            이름 KOREAEXIM_KEY, 값은 한국수출입은행 오픈API 인증키

on:
  schedule:
    # 수출입은행은 영업일 11시(KST) 전후에 고시한다. 11:00 KST = 02:00 UTC.
    #
    # 하루 한 번(12:30 KST)만 돌렸더니 당일 값을 못 받는 날이 생겼다.
    # GitHub Actions 예약 실행은 무료 러너에서 몇 시간씩 밀리는 일이 흔하다
    # (2026-09-01 실측: 예약 12:30 KST → 실제 17:50 KST, 5시간 20분 지연).
    # 그러면 "내일 적용환율"이 저녁까지 미정으로 남는다 — 내일 적용분은 오늘 고시분이라서.
    #
    # 그래서 하루 네 번으로 늘린다. 이미 받은 날짜는 API를 아예 호출하지 않고
    # 커밋도 만들지 않으므로(fetch-rates.mjs의 buildTargets 참고) 추가 비용은 없다.
    # 정각·30분은 GitHub에서 가장 붐비는 시각이라 :17로 비켜둔다.
    - cron: "17 2,4,7,10 * * 1-5" # 11:17 / 13:17 / 16:17 / 19:17 KST

  # 과거 구간을 메우거나 즉시 갱신할 때 수동 실행.
  workflow_dispatch:
    inputs:
      from:
        description: "시작일 (YYYY-MM-DD). 비우면 최근 10일만 확인"
        required: false
        type: string
      to:
        description: "종료일 (YYYY-MM-DD). 비우면 오늘"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: update-rates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 환율 수집
        env:
          KOREAEXIM_KEY: ${{ secrets.KOREAEXIM_KEY }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
        run: node scripts/fetch-rates.mjs

      - name: 변경분 커밋
        run: |
          if git diff --quiet -- data/rates.json; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rates.json
          git commit -m "환율 갱신: $(node -e "const d=require('./data/rates.json');console.log(d.latest+' 기준 '+d.count+'일치')")"
          git push
